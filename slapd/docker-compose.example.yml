services:
  slapd:
    image: ghcr.io/sphenhe/slapd:2.6.10
    container_name: slapd
    restart: unless-stopped
    volumes:
      - ./slapd.d:/etc/ldap/slapd.d
      - ./data:/var/lib/ldap
    ports:
      - "389:389"
    healthcheck:
      test: ["CMD", "ldapsearch", "-x", "-H", "ldap://127.0.0.1:389", "-b", "", "-s", "base", "namingContexts"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
