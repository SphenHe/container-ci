name: Build DeepSeek Harness

on:
  workflow_dispatch:
    inputs:
      dsh_version:
        description: >-
          @deepseek-ai/dsh npm version or dist-tag. Use latest for the current
          npm latest release, or enter an exact version such as 0.1.2-rc.1.
        required: false
        default: latest
        type: string

  push:
    branches:
      - master
    paths:
      - "dsh/**"
      - ".github/workflows/dsh.yml"

env:
  REGISTRY_IMAGE: ghcr.io/sphenhe/dsh

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker
        uses: docker/setup-docker-action@v5
        with:
          version: latest
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
        id: setup-buildx

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.REGISTRY_IMAGE }}

      - name: Resolve dsh npm version
        id: dsh-version
        env:
          DSH_SPEC: ${{ github.event_name == 'workflow_dispatch' && (inputs.dsh_version || 'latest') || 'latest' }}
        run: |
          resolved="$(npm view "@deepseek-ai/dsh@${DSH_SPEC}" version 2>/dev/null || true)"
          if [ -z "${resolved}" ]; then
            echo "Could not resolve @deepseek-ai/dsh@${DSH_SPEC}" >&2
            exit 1
          fi
          if [ "$(printf '%s\n' "${resolved}" | wc -l)" -ne 1 ]; then
            echo "Expected one dsh version, got: ${resolved}" >&2
            exit 1
          fi
          echo "spec=${DSH_SPEC}" >> "$GITHUB_OUTPUT"
          echo "resolved=${resolved}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg DSH_VERSION=${{ steps.dsh-version.outputs.resolved }} \
            --label "${DOCKER_METADATA_OUTPUT_LABELS//$'\n'/,}" \
            -t ${{ env.REGISTRY_IMAGE }}:latest \
            -t ${{ env.REGISTRY_IMAGE }}:${{ steps.dsh-version.outputs.resolved }} \
            --output type=registry,compression=gzip \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            .
        working-directory: dsh
