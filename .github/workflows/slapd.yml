name: Build slapd

on:
  workflow_dispatch:

  push:
    branches:
      - master
    paths:
      - "slapd/**"
      - ".github/workflows/slapd.yml"

env:
  REGISTRY_IMAGE: ghcr.io/sphenhe/slapd
  SLAPD_VERSION: "2.6.10"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker
        uses: docker/setup-docker-action@v5
        with:
          version: latest
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
        id: setup-buildx

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.REGISTRY_IMAGE }}

      - name: Build and push
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg SLAPD_VERSION=${{ env.SLAPD_VERSION }} \
            --label "${DOCKER_METADATA_OUTPUT_LABELS//$'\n'/,}" \
            -t ${{ env.REGISTRY_IMAGE }}:latest \
            -t ${{ env.REGISTRY_IMAGE }}:${{ env.SLAPD_VERSION }} \
            --output type=registry,compression=gzip \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            .
        working-directory: slapd
