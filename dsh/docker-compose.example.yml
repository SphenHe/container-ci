services:
  dsh:
    image: ghcr.io/sphenhe/dsh:latest
    container_name: dsh
    restart: unless-stopped

    # No host port mapping. The image binds dsh to 0.0.0.0, so other services
    # on this network can reach the Web UI at http://dsh:3080.
    # Port:
    # - "3080:3080"

    environment:
      DSH_HOME: /home/node/.dsh

    volumes:
      - ./data/workspace:/workspace
      - dsh-home:/home/node/.dsh

volumes:
  dsh-home:
