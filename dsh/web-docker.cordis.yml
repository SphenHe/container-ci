# Docker container-network overlay for the dsh web profile.
#
# dsh intentionally rejects --host 0.0.0.0 from the command line, so this patch
# overrides the webserver row after the web bundle layer. Keep this image on a
# trusted Docker network: the UI is reachable by every container on it.
- id: webserver
  config:
    host: 0.0.0.0
    port: !!js ctx.webStartup.port ?? 3080
    compression: gzip
    compressionLevel: 1
    compressionThresholdBytes: 1024
